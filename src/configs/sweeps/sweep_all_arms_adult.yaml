# Main results on Adult (Table III): FADO, Aranyani, ARF, and RFR on the four injected drifts.
#
# One run per (seed, scenario); each run evaluates the four methods on the same stream.
# 120 runs (4 scenarios x 30 reporting seeds).
program: src/main.py
project: fado-ablations
method: grid
name: all-arms-adult
metric:
  name: delta_dp
  goal: maximize
parameters:
  pipeline_model:
    value: 'fado,aranyani,arf,rfr'
  pipeline_dataset:
    value: adult
  drift_scenario:
    values:
      - sim_x_permutations
      - sim_y_swaps
      - sim_y_prior_skip
      - sim_x_exceed_skip
  seeds:
    values: ['66', '77', '88', '99', '101', '111', '122', '133', '144', '155', '166', '177', '188', '199', '202', '213', '224', '235', '246', '257', '268', '279', '291', '303', '314', '325', '336', '347', '358', '369']
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
