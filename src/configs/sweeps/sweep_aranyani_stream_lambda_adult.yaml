# Aranyani with leaked lambda on Adult (Table III): pre-trained exactly like FADO (lambda_base = 0.1),
# then streamed with a fixed lambda = 1.5, at least FADO's whole-stream mean lambda_t on Adult.
# Same starting forest as FADO (pre-training is deterministic per seed); pairs by seed with FADO.
#
# 120 runs (4 scenarios x 30 reporting seeds).
program: src/main.py
project: fado-ablations
method: grid
name: aranyani-stream-lambda-adult
metric:
  name: aranyani/stream_final_dp
  goal: minimize
parameters:
  pipeline_model:
    value: 'aranyani'
  pipeline_dataset:
    value: adult
  lambda_const:
    value: 1.5
  pretrain_lambda_const:
    value: 0.1
  drift_scenario:
    values:
      - sim_x_permutations
      - sim_y_swaps
      - sim_y_prior_skip
      - sim_x_exceed_skip
  seeds:
    values: ['66', '77', '88', '99', '101', '111', '122', '133', '144', '155', '166', '177', '188', '199', '202', '213', '224', '235', '246', '257', '268', '279', '291', '303', '314', '325', '336', '347', '358', '369']
  deterministic:
    value: true
  wandb_log:
    value: true
  wandb_project:
    value: fado-ablations
command:
  - ${env}
  - PYTHONHASHSEED=0
  - ${interpreter}
  - -m
  - src.main
  - ${args}
